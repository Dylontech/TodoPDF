# ─────────────────────────────────────────────────────────────
# TodoPDF — nginx del frontend
# Sirve los estáticos de Astro y proxya la API al backend.
# ─────────────────────────────────────────────────────────────

# Cloudflare termina TLS antes de llegar a nginx, por lo que $scheme es
# "http" aunque el navegador esté usando HTTPS. Conserva el esquema
# externo para que Express pueda emitir cookies Secure correctamente.
map $http_cf_visitor $external_scheme {
    default $scheme;
    ~*"scheme":"https" https;
    ~*"scheme":"http" http;
}

server {
    listen 80;
    server_name _;

    # Redirecciones RELATIVAS: nginx solo escucha en el puerto 80 interno, así
    # que una redirección absoluta a /login/ apuntaría a http://host:80 y
    # perdería el puerto publicado (8080) o el HTTPS de Cloudflare. Con esto
    # el navegador conserva esquema, host y puerto que ya usaba.
    absolute_redirect off;

    # Tamaño máximo de subida (debe superar TODOPDF_MAX_UPLOAD_AUTH)
    client_max_body_size 110m;

    root /usr/share/nginx/html;
    index index.html;

    # Estáticos de Astro (SPA fallback a index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → backend (nombre de servicio de docker-compose)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $external_scheme;

        # Conversiones largas (Ghostscript), descargas de vídeo (yt-dlp)
        # y streaming de descargas: margen amplio para vídeos largos.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_request_buffering off;
    }
}
