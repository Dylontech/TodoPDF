# ─────────────────────────────────────────────────────────────
# TodoPDF — nginx del frontend
# Sirve los estáticos de Astro y proxya la API al backend.
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Tamaño máximo de subida (debe superar TODOPDF_MAX_UPLOAD_AUTH)
    client_max_body_size 110m;

    root /usr/share/nginx/html;
    index index.html;

    # Estáticos de Astro (SPA fallback a index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API → backend (nombre de servicio de docker-compose)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Conversiones largas (Ghostscript) y streaming de descargas
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }
}
