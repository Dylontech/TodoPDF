# ─────────────────────────────────────────────────────────────
# TodoPDF — Orquestación completa (frontend, backend, MariaDB)
# Los valores ${VAR:-default} se sustituyen desde .env (opcional).
# ─────────────────────────────────────────────────────────────
name: todopdf

services:
  # ── Base de datos ──────────────────────────────────────────
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${TODOPDF_DB_NAME:-todopdf}
      MARIADB_USER: ${TODOPDF_DB_USER:-todopdf}
      MARIADB_PASSWORD: ${TODOPDF_DB_PASSWORD:?Define TODOPDF_DB_PASSWORD en .env}
      MARIADB_ROOT_PASSWORD: ${TODOPDF_DB_ROOT_PASSWORD:?Define TODOPDF_DB_ROOT_PASSWORD en .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ── API REST ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      # Red del host durante el build: evita ECONNRESET del registro npm
      # en redes bridge/VPN (la red host sí alcanza el registro).
      network: host
    restart: unless-stopped
    environment:
      TODOPDF_NODE_ENV: ${TODOPDF_NODE_ENV:-production}
      TODOPDF_PORT: ${TODOPDF_PORT:-3000}
      # Secreto de sesión: obligatorio para evitar sesiones falsificables.
      TODOPDF_SESSION_SECRET: ${TODOPDF_SESSION_SECRET:?Define TODOPDF_SESSION_SECRET en .env}
      TODOPDF_CORS_ORIGIN: ${TODOPDF_CORS_ORIGIN:?Define TODOPDF_CORS_ORIGIN en .env}
      TODOPDF_COOKIE_SECURE: ${TODOPDF_COOKIE_SECURE:-true}
      TODOPDF_GOOGLE_CLIENT_ID: ${PUBLIC_GOOGLE_CLIENT_ID:-}
      TODOPDF_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:4321}
      TODOPDF_ADMIN_EMAILS: ${TODOPDF_ADMIN_EMAILS:-}
      TODOPDF_RETENTION_DAYS: ${TODOPDF_RETENTION_DAYS:-14}
      # Base de datos (host = nombre del servicio)
      TODOPDF_DB_HOST: db
      TODOPDF_DB_PORT: ${TODOPDF_DB_PORT:-3306}
      TODOPDF_DB_NAME: ${TODOPDF_DB_NAME:-todopdf}
      TODOPDF_DB_USER: ${TODOPDF_DB_USER:-todopdf}
      TODOPDF_DB_PASSWORD: ${TODOPDF_DB_PASSWORD:?Define TODOPDF_DB_PASSWORD en .env}
      # Límites de subida
      TODOPDF_MAX_UPLOAD_GUEST: ${TODOPDF_MAX_UPLOAD_GUEST:-26214400}
      TODOPDF_MAX_UPLOAD_AUTH: ${TODOPDF_MAX_UPLOAD_AUTH:-104857600}
      # Conversión
      TODOPDF_GS_TIMEOUT_MS: ${TODOPDF_GS_TIMEOUT_MS:-60000}
      TODOPDF_MAX_PAGES: ${TODOPDF_MAX_PAGES:-100}
      TODOPDF_JPEG_QUALITY: ${TODOPDF_JPEG_QUALITY:-85}
      TODOPDF_IMAGE_DPI: ${TODOPDF_IMAGE_DPI:-150}
      TODOPDF_MAX_CONCURRENCY: ${TODOPDF_MAX_CONCURRENCY:-2}
      # Conversión Office (LibreOffice)
      TODOPDF_SOFFICE_TIMEOUT_MS: ${TODOPDF_SOFFICE_TIMEOUT_MS:-120000}
      TODOPDF_OFFICE_MAX_CONCURRENCY: ${TODOPDF_OFFICE_MAX_CONCURRENCY:-1}
      # OCR de PDFs escaneados (tesseract) para PDF → Office
      TODOPDF_OCR_LANGS: ${TODOPDF_OCR_LANGS:-spa+eng}
      TODOPDF_OCR_DPI: ${TODOPDF_OCR_DPI:-300}
      TODOPDF_OCR_TIMEOUT_MS: ${TODOPDF_OCR_TIMEOUT_MS:-120000}
      TODOPDF_OCR_MAX_PAGES: ${TODOPDF_OCR_MAX_PAGES:-50}
      TODOPDF_OCR_MIN_CHARS_PER_PAGE: ${TODOPDF_OCR_MIN_CHARS_PER_PAGE:-40}
      # Descargador de vídeos (yt-dlp)
      TODOPDF_DOWNLOAD_CONCURRENCY: ${TODOPDF_DOWNLOAD_CONCURRENCY:-2}
      TODOPDF_DOWNLOAD_TIMEOUT_MS: ${TODOPDF_DOWNLOAD_TIMEOUT_MS:-1800000}
      # Quitar fondo de imagen (rembg, solo autenticados)
      TODOPDF_REMOVEBG_PYTHON: /opt/rembg/bin/python
      TODOPDF_REMOVEBG_MODEL: ${TODOPDF_REMOVEBG_MODEL:-u2net}
      TODOPDF_REMOVEBG_TIMEOUT_MS: ${TODOPDF_REMOVEBG_TIMEOUT_MS:-120000}
      TODOPDF_REMOVEBG_CONCURRENCY: ${TODOPDF_REMOVEBG_CONCURRENCY:-1}
      # Vectorizar imagen a SVG (vtracer, solo autenticados)
      TODOPDF_VECTORIZE_PYTHON: /opt/rembg/bin/python
      TODOPDF_VECTORIZE_TIMEOUT_MS: ${TODOPDF_VECTORIZE_TIMEOUT_MS:-120000}
      TODOPDF_VECTORIZE_CONCURRENCY: ${TODOPDF_VECTORIZE_CONCURRENCY:-1}
      # Quitar objetos de imagen (LaMa big-lama ONNX, solo autenticados)
      TODOPDF_INPAINT_PYTHON: /opt/rembg/bin/python
      TODOPDF_INPAINT_MODEL: /models/big-lama.onnx
      TODOPDF_INPAINT_TIMEOUT_MS: ${TODOPDF_INPAINT_TIMEOUT_MS:-180000}
      TODOPDF_INPAINT_CONCURRENCY: ${TODOPDF_INPAINT_CONCURRENCY:-1}
      # Reescalar imagen (sharp x2/x4 libre; Real-ESRGAN x8/x16 con cuenta)
      TODOPDF_UPSCALE_PYTHON: /opt/rembg/bin/python
      TODOPDF_UPSCALE_MODEL: /models/real-esrgan-x4plus-128.onnx
      TODOPDF_UPSCALE_TIMEOUT_MS: ${TODOPDF_UPSCALE_TIMEOUT_MS:-600000}
      TODOPDF_UPSCALE_CONCURRENCY: ${TODOPDF_UPSCALE_CONCURRENCY:-1}
      TODOPDF_UPSCALE_MAX_OUTPUT_PIXELS: ${TODOPDF_UPSCALE_MAX_OUTPUT_PIXELS:-268435456}
      # Flashcards (biblioteca de ilustraciones, exportación a PDF/PPTX)
      TODOPDF_FLASHCARDS_MAX_CARDS: ${TODOPDF_FLASHCARDS_MAX_CARDS:-200}
      TODOPDF_FLASHCARDS_TIMEOUT_MS: ${TODOPDF_FLASHCARDS_TIMEOUT_MS:-120000}
      TODOPDF_FLASHCARDS_CONCURRENCY: ${TODOPDF_FLASHCARDS_CONCURRENCY:-1}
      # Fuente TTF embebida en el PDF (vacío = candidatos por defecto: DejaVu/Noto)
      TODOPDF_FLASHCARDS_FONT: ${TODOPDF_FLASHCARDS_FONT:-}
      TODOPDF_FLASHCARDS_FONT_BOLD: ${TODOPDF_FLASHCARDS_FONT_BOLD:-}
      # Storage (montado como volumen)
      TODOPDF_STORAGE_DIR: /data/storage
      TODOPDF_TEMP_DIR: /data/tmp
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Volumen con los archivos de usuarios autenticados
      - uploads:/data
    expose:
      - "3000"
    # Memoria: LibreOffice headless puede consumir cientos de MB por instancia
    # (concurrencia Office limitada a 1). shm_size cubre el /dev/shm que usa LO.
    shm_size: "256m"
    # Protección básica de RAM (rembg + LibreOffice necesitan margen)
    mem_limit: ${TODOPDF_BACKEND_MEM_LIMIT:-3g}

  cleanup:
    build:
      context: ./backend
      network: host
    restart: unless-stopped
    command: npm run cleanup
    environment:
      TODOPDF_NODE_ENV: ${TODOPDF_NODE_ENV:-production}
      TODOPDF_DB_HOST: db
      TODOPDF_DB_PORT: ${TODOPDF_DB_PORT:-3306}
      TODOPDF_DB_NAME: ${TODOPDF_DB_NAME:-todopdf}
      TODOPDF_DB_USER: ${TODOPDF_DB_USER:-todopdf}
      TODOPDF_DB_PASSWORD: ${TODOPDF_DB_PASSWORD:?Define TODOPDF_DB_PASSWORD en .env}
      TODOPDF_RETENTION_DAYS: ${TODOPDF_RETENTION_DAYS:-14}
      TODOPDF_RETENTION_INTERVAL_MS: ${TODOPDF_RETENTION_INTERVAL_MS:-3600000}
      TODOPDF_STORAGE_DIR: /data/storage
      TODOPDF_TEMP_DIR: /data/tmp
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/data

  # ── Frontend (Astro + nginx) ───────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_GOOGLE_CLIENT_ID: ${PUBLIC_GOOGLE_CLIENT_ID:-}
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:4321}
      # Red del host durante el build (mismo motivo que el backend).
      network: host
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${TODOPDF_HTTP_PORT:-8080}:80"

volumes:
  db_data:      # datos de MariaDB
  uploads:      # archivos convertidos de usuarios autenticados
